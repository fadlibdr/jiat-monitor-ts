name: CI

# LLD §10: unit + feature tests on every push. The suite needs no external Postgres
# (PGlite runs Postgres in WASM, so RLS, triggers and policies are exercised for real).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts changed without a committed migration: run npm run db:generate"
            git status --porcelain drizzle
            exit 1
          fi

  # The SPA (web/, its own package and lockfile): strict typecheck + production build. The pure
  # helpers it shares with the server (web/src/lib) are tested by the root suite above.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: No inline script in the built shell (the CSP allows none)
        run: |
          if grep -Eq '<script>|<script [^>]*>[^<]' dist/index.html; then
            echo "::error::dist/index.html has an inline script; the server's CSP (script-src 'self') would block it"
            exit 1
          fi
