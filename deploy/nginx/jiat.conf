# nginx in front of the API. Template: replace the server name and certificate paths.
# The API trusts X-Forwarded-For only from AUTH_TRUSTED_PROXIES (set it to 127.0.0.1/32 with this file).

limit_req_zone $binary_remote_addr zone=jiat_api:10m rate=20r/s;

server {
  listen 443 ssl;
  http2 on;
  server_name monitor.example.co.id;

  ssl_certificate     /etc/letsencrypt/live/monitor.example.co.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/monitor.example.co.id/privkey.pem;

  # BOQ workbooks are up to 15 MB (MAX_UPLOAD in src/http/app.ts)
  client_max_body_size 16m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location / {
    limit_req zone=jiat_api burst=40 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Telegram calls this; the API checks X-Telegram-Bot-Api-Secret-Token. Telegram's own retries
  # are bursty, so no rate limit here (a 429 would only make it re-send).
  location = /telegram/webhook {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 1m;
  }
}

server {
  listen 80;
  server_name monitor.example.co.id;
  return 301 https://$host$request_uri;
}
