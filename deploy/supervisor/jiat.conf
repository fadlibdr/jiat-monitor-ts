; Supervisor programs for the VPS (LLD §9: "worker dijalankan oleh Supervisor di VPS yang sama").
; Template: replace /opt/jiat, the user and the log paths with the real ones.
;   npm ci && npm run build && npm run db:migrate   (once per release, as the owner role)
;   cp deploy/supervisor/jiat.conf /etc/supervisor/conf.d/ && supervisorctl reread && supervisorctl update
; The .env file (chmod 600, owned by the jiat user) is read by Node itself (--env-file), so secrets
; never appear in this file or in the process list.

[program:jiat-api]
command=/usr/bin/node --env-file=/opt/jiat/.env dist/server.js
directory=/opt/jiat
user=jiat
environment=NODE_ENV="production"
autostart=true
autorestart=true
; SIGTERM lets the server finish in-flight requests and close the pool
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/jiat/api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
redirect_stderr=true

[program:jiat-worker]
command=/usr/bin/node --env-file=/opt/jiat/.env dist/worker.js
directory=/opt/jiat
user=jiat
environment=NODE_ENV="production"
autostart=true
autorestart=true
; a job in progress finishes its transaction; a job interrupted mid-way is retried (lock taken over after 15 min)
stopsignal=TERM
stopwaitsecs=90
stdout_logfile=/var/log/jiat/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
redirect_stderr=true
